\* DOCUMENTS the accepted soft-quota limitation as a reproducible counterexample.
\* Checks ObsImpl against the EXACT-quota oracle (ObsAbstractExact), which it does
\* NOT satisfy. Expected result: TLC reports "RefinementExact violated" with a trace
\* where two concurrent commits to different keys both pass the quota check at used=0
\* and both apply, reaching used=2 > QUOTA_LIMIT=1. This is the known/accepted issue;
\* exact enforcement is delegated to a separate mechanism (QuotaRepair / reservation).
SPECIFICATION Spec
CONSTANTS
  KEYS = {0, 1}
  CLIENTS = {0}
  PROPS = {0, 1}
  Procs = {1, 2}
  STRIPES = 2
  NoProc = NoProc
  SORTED = TRUE
  MAX_OPS = 2
  QUOTA_LIMIT = 1
PROPERTY RefinementExact
INVARIANT LockInv
INVARIANT NoLeak
INVARIANT UsedConsistent
