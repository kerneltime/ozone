\* Stripe-COLLISION scope: STRIPES=1 forces all keys onto a single stripe, so every
\* key op contends on stripe 0 + bucket, and a rename's two slots collide -> must dedup
\* to a single X (else self-deadlock). Validates dedup-to-strongest under collision.
\* Expected: No error (dedup makes it deadlock-free and still linearizable).
SPECIFICATION Spec
CONSTANTS
  KEYS = {0, 1, 2}
  CLIENTS = {0}
  PROPS = {0, 1}
  Procs = {1, 2}
  STRIPES = 1
  NoProc = NoProc
  SORTED = TRUE
  MAX_OPS = 2
  QUOTA_LIMIT = 1
PROPERTY Refinement
INVARIANT LockInv
INVARIANT NoLeak
INVARIANT UsedConsistent
