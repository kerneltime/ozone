\* M3 (recursive delete) tight bound: 2 procs x 1 op on the 3-level seeded tree.
\* MAXOID=5 leaves room (oids 1-3 seeded) to create a child under an orphaned-but-
\* present dir, exercising the create-under-purging-subtree orphan race.
\* Strict NoOrphan is intentionally NOT checked (transient orphans exist mid-purge);
\* Accounted is the M3 safety invariant (no permanent unaccounted orphan).
SPECIFICATION Spec
CONSTANTS
  NAMES = {0, 1}
  CLIENTS = {0}
  MAXOID = 5
  Procs = {1, 2}
  NoProc = NoProc
  MAX_OPS = 1
PROPERTY Refinement
INVARIANT LockInv
INVARIANT NoLeak
INVARIANT Accounted
